[package]
name = "leplay-windows"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "LePlayWindows"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "http2"] }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
